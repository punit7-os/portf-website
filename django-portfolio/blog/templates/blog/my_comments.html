{% extends "blog/base.html" %}

{% block title %}My Comments | SourCEO{% endblock %}

{% block content %}

<!-- ================= HEADER ================= -->
<section class="bg-white border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 md:px-6 lg:px-8 py-14">
    <h1 class="text-3xl font-bold text-dark">
      My Comments
    </h1>
    <p class="mt-2 text-slate-600">
      Your activity across the blog.
    </p>
  </div>
</section>

<!-- ================= CONTENT ================= -->
<section class="py-16">
  <div class="max-w-4xl mx-auto px-4 md:px-6 lg:px-8">

    <!-- Empty State -->
    <div class="bg-slate-50 border border-dashed border-slate-300 rounded-xl p-10 text-center">
      <h2 class="text-xl font-semibold text-dark">
        No comments yet
      </h2>
      <p class="mt-3 text-slate-600">
        When you start commenting on articles,
        they’ll appear here.
      </p>
      <a href="{% url 'blog:home' %}"
         class="inline-block mt-5 px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-blue-700 transition">
        Explore Articles
      </a>
    </div>

  </div>
</section>

{% endblock %}
